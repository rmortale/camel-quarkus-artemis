services:
  camel-quarkus:
    #image: ghcr.io/rmortale/camel-quarkus-artemis:main
    image: quarkus/code-with-quarkus-jvm
    #pull_policy: always
    environment:
      QUARKUS_ARTEMIS_URL: tcp://oravm05:61616
      QUARKUS_ARTEMIS_USERNAME: artemis
      QUARKUS_ARTEMIS_PASSWORD: artemis
      QUARKUS_PROFILE: cpvai001d
      QUARKUS_LOG_CATEGORY_UPPERCASETRANSFORMATION_LEVEL: DEBUG
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.0001'
          memory: 256M


# build jar
# mvn clean package
# build image with
# docker build -f src/main/docker/Dockerfile.jvm -t quarkus/code-with-quarkus-jvm .

# run with
# docker compose up
