apiVersion: apps/v1
kind: Deployment
metadata:
  name: camel-quarkus-artemis
spec:
  template:
    spec:
      containers:
        - name: camel-quarkus-artemis
          env:
            - name: APP_AGENT_CONFIG_ID
              value: "agent1"
            - name: APP_AGENT_CONFIG_VERSION
              value: "2.0"
            - name: QUARKUS_PROFILE
              value: "cpvai001d"
